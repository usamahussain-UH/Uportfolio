<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- glow line -->
  <rect x="40" y="42" width="1120" height="3" rx="1.5" fill="url(#g)" filter="url(#blur)" opacity="0.85"/>
  <rect x="40" y="42" width="1120" height="3" rx="1.5" fill="url(#g)" opacity="0.9"/>

  <!-- skyline chips -->
  <g opacity="0.95">
    <rect x="70" y="110" width="70" height="120" rx="10" fill="url(#g)" opacity="0.14"/>
    <rect x="155" y="90" width="110" height="140" rx="12" fill="url(#g)" opacity="0.11"/>
    <rect x="285" y="122" width="90" height="108" rx="12" fill="url(#g)" opacity="0.10"/>
    <rect x="390" y="70" width="140" height="160" rx="14" fill="url(#g)" opacity="0.12"/>
    <rect x="550" y="108" width="110" height="122" rx="12" fill="url(#g)" opacity="0.10"/>
    <rect x="680" y="84" width="150" height="146" rx="14" fill="url(#g)" opacity="0.12"/>
    <rect x="850" y="118" width="100" height="112" rx="12" fill="url(#g)" opacity="0.10"/>
    <rect x="965" y="96" width="140" height="134" rx="14" fill="url(#g)" opacity="0.11"/>
  </g>

  <!-- nodes -->
  <g opacity="0.9">
    <circle cx="130" cy="100" r="3" fill="#22D3EE"/>
    <circle cx="320" cy="112" r="3" fill="#8B5CF6"/>
    <circle cx="485" cy="62" r="3" fill="#34D399"/>
    <circle cx="740" cy="76" r="3" fill="#22D3EE"/>
    <circle cx="1040" cy="90" r="3" fill="#8B5CF6"/>
    <path d="M130 100 C 220 50, 280 150, 320 112" stroke="url(#g)" stroke-width="1.5" opacity="0.55"/>
    <path d="M320 112 C 390 95, 430 40, 485 62" stroke="url(#g)" stroke-width="1.5" opacity="0.45"/>
    <path d="M485 62 C 600 18, 650 120, 740 76" stroke="url(#g)" stroke-width="1.5" opacity="0.45"/>
    <path d="M740 76 C 860 18, 930 122, 1040 90" stroke="url(#g)" stroke-width="1.5" opacity="0.45"/>
  </g>
</svg>
